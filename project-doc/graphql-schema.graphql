type Query {
  auctions: [Auction!]!
  auction(id: ID!): Auction
  adminAuctions: [Auction!]!
  me: User
}

type Mutation {
  register(name: String!, email: String!, password: String!): User!
  login(email: String!, password: String!): AuthToken!
  oauthToken(
    grantType: String!
    clientId: Int!
    clientSecret: String!
    username: String!
    password: String!
    scope: String
  ): AuthToken!
  placeBid(auctionId: ID!, amount: Float!, requestId: String): PlaceBidResult!
  withdrawBid(auctionId: ID!, reason: String): WithdrawBidResult!
  createAuction(
    title: String!
    description: String
    startingPrice: Float!
    minIncrement: Float!
    endTime: String!
    category: String!
    status: String
  ): Auction!
  updateAuction(
    id: ID!
    title: String
    description: String
    startingPrice: Float
    minIncrement: Float
    currentPrice: Float
    endTime: String
    category: String
    status: String
  ): Auction!
  adjustAuctionTime(id: ID!, deltaMinutes: Int!): AuctionTimeAdjustResult!
  deleteAuction(id: ID!): Boolean!
  logout: Boolean!
}

type Auction {
  id: ID!
  title: String!
  description: String
  startingPrice: Float!
  currentPrice: Float!
  minIncrement: Float!
  currentWinnerId: ID
  winnerName: String
  endTime: String
  category: String!
  status: String!
  participantCount: Int!
  bids: [BidFeedItem!]!
}

type BidFeedItem {
  id: ID!
  amount: Float!
  status: String!
  bidderName: String
  createdAt: String!
}

type User {
  id: ID!
  name: String!
  email: String!
  isAdmin: Boolean
  walletBalance: Float
}

type AuthToken {
  access_token: String!
  token_type: String!
  expires_in: Int!
}

type PlaceBidResult {
  accepted: Boolean!
  currentPrice: Float!
  endTime: String!
  errorCode: String
}

type WithdrawBidResult {
  success: Boolean!
  restoredPrice: Float!
  restoredWinnerId: ID
}

type AuctionTimeAdjustResult {
  id: ID!
  endTime: String!
  status: String!
}
